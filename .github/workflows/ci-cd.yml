name: CI/CD - Ansible Deploy

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps & run tests
        run: |
          cd app
          # Si no tienes tests aún, cambia 'npm test' por 'echo "No tests yet"'
          npm install
          echo "Testing skipped for now" 

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          # Usamos StrictHostKeyChecking=no para no depender del secreto SSH_KNOWN_HOSTS por ahora
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_ROLES_PATH: ./ansible/roles
        run: |
          # Importante: ejecutamos desde la raíz porque tu repo tiene la carpeta 'ansible'
          ansible-playbook -i ansible/inventories/production.yml ansible/playbooks/deploy.yml --private-key ~/.ssh/id_rsa